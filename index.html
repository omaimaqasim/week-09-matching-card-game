<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>matching card game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================================
         Game Tracking Section
    ================================ -->
    <div class="track_container">
        <h1>Matching Card game</h1>

        <div class="tracking">

            <div class="moves_check">
                <h1>moves</h1>
                <p>0</p>
            </div>

            <div class="matches_tracking">
                <h1>matches</h1>
                <p>0/0</p>
            </div>

        </div>

        <!-- Restart Button -->
        <button class="restart">Restart</button>
    </div>


    <!-- ================================
         Game Container
    ================================ -->
    <div class="game_container">
        <!-- Cards are injected here by JavaScript -->
    </div>


      <!-- ================================
          win/pop-up div
    ================================ -->

    <div class="win_cont hidden">
        <h1>congratulations! you win </h1>
         <p></p>
          <button class="play_again">
            play again
          </button>
    </div>

    <!-- ================================
         Script
    ================================ -->
    <script src="script.js"></script>

</body>
</html>
